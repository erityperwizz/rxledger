name: rxledger
version: "1.0.0"
config-version: 2
profile: rxledger

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  bronze_dir: "{{ env_var('RXL_BRONZE_DIR', '../data/bronze') }}"

models:
  rxledger:
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

tests:
  rxledger:
    +severity: error
